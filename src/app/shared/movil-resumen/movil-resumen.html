<div class="rounded-4 p-3" style="background: var(--agro-soft)">
  <div class="text-uppercase fw-bold mb-2" style="font-size: 0.64rem; letter-spacing: 0.07em; color: var(--agro-muted)">{{ titulo() }}</div>
  @for (f of filas(); track f.etiqueta) {
    <div class="d-flex justify-content-between py-1">
      <span>{{ f.etiqueta }}</span>
      <strong>{{ f.valor }}</strong>
    </div>
  }
</div>
