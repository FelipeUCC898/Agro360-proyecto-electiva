<app-page-header titulo="Alertas y clima" subtitulo="Hoy, 19 oct" />

<div class="row g-3">
  <div class="col-lg-8">
    <div class="card">
      <div class="card-body">
        <h2 class="card-title mb-3">Alertas</h2>
        <div class="d-grid gap-3">
          @for (a of alertas; track a.id) {
            <div class="border rounded-3 p-3 d-flex gap-3 align-items-start alerta" [class.atendida]="estaAtendida(a.id)">
              <i class="bi fs-3 mt-1" [class]="iconos[a.tipo]"></i>
              <div class="flex-grow-1">
                <div class="fw-bold">{{ a.titulo }}</div>
                <div class="text-secondary small">{{ a.detalle }}</div>
              </div>
              <div class="d-flex flex-column align-items-end gap-2">
                @if (estaAtendida(a.id)) {
                  <app-status-pill texto="Atendida" tono="ok" />
                } @else {
                  <app-status-pill [texto]="etiquetas[a.prioridad]" [tono]="tonos[a.prioridad]" />
                }
                <button type="button" class="btn btn-sm btn-outline-dark" [disabled]="estaAtendida(a.id)" (click)="marcarAtendida(a.id)">
                  Marcar atendida
                </button>
              </div>
            </div>
          }
        </div>
      </div>
    </div>
  </div>

  <div class="col-lg-4 d-grid gap-3 align-content-start">
    <div class="card">
      <div class="card-body">
        <h2 class="card-title mb-3">Clima de la finca</h2>
        <div class="d-flex align-items-center gap-3 mb-3">
          <i class="bi bi-cloudy display-4"></i>
          <div>
            <div class="h2 fw-bold mb-0">{{ clima.maxima }}° / {{ clima.minima }}°</div>
            <div class="text-secondary small">{{ clima.estado }}</div>
          </div>
        </div>
        <div class="row text-center g-2">
          @for (p of pronostico; track p.dia) {
            <div class="col-4">
              <div class="small text-secondary">{{ p.dia }}</div>
              <div class="h5 fw-bold mb-0">{{ p.lluvia }} %</div>
              <div class="small text-secondary">lluvia</div>
            </div>
          }
        </div>
      </div>
    </div>

    <div class="card">
      <div class="card-body">
        <h2 class="card-title mb-3">Mapa de calor / lotes</h2>
        <app-placeholder-box texto="mapa" icono="bi-map" [alto]="250" />
      </div>
    </div>
  </div>
</div>
