<app-movil-header titulo="Alertas de hoy" [subtitulo]="finca.nombre" />

<div class="d-grid gap-2 mb-3">
  @for (a of alertas; track a.titulo) {
    <div class="tarjeta-movil p-3 d-flex align-items-center gap-3 alerta" [class]="'tarjeta-movil p-3 d-flex align-items-center gap-3 alerta t-' + a.tipo" [class.destacada]="a.destacada">
      <span class="icono"><i class="bi" [class]="iconos[a.tipo]"></i></span>
      <div>
        <div class="fw-bold">{{ a.titulo }}</div>
        <div class="small text-secondary">{{ a.detalle }}</div>
      </div>
    </div>
  }
</div>

<div class="clima-movil rounded-4 p-3 text-white">
  <div class="fw-bold mb-2">Clima hoy</div>
  <div class="d-flex align-items-center gap-3">
    <i class="bi bi-cloud-sun display-5"></i>
    <div>
      <div class="h4 fw-bold mb-0">{{ clima.maxima }}° / {{ clima.minima }}°</div>
      <div class="small opacity-75">Lluvia mañana: {{ clima.lluviaManana }} %</div>
    </div>
  </div>
</div>
