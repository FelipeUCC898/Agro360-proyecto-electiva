<app-movil-header titulo="Registrar riego" subtitulo="Lote A · Riego" />

<form class="d-grid gap-3" #formulario="ngForm" (ngSubmit)="guardar()">
  <div>
    <label class="form-label small text-secondary mb-1" for="mri-metodo">Método</label>
    <select id="mri-metodo" name="metodo" class="form-select" [(ngModel)]="metodo">
      @for (m of metodos; track m) {
        <option [value]="m">{{ m }}</option>
      }
    </select>
  </div>

  <div>
    <label class="form-label small text-secondary mb-1" for="mri-horas">Duración</label>
    <div class="input-group">
      <input id="mri-horas" name="horas" type="number" min="0.5" step="0.5" class="form-control" required [(ngModel)]="horas" />
      <span class="input-group-text">h</span>
    </div>
  </div>

  <div>
    <label class="form-label small text-secondary mb-1" for="mri-observacion">Observación</label>
    <input id="mri-observacion" name="observacion" class="form-control" [(ngModel)]="observacion" />
  </div>

  <app-movil-resumen titulo="Al guardar se actualiza solo" [filas]="resumen" />

  <button type="submit" class="btn btn-primary py-2" [disabled]="formulario.invalid">Guardar riego</button>
</form>
